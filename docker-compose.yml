services:
  portal-web:
    build: .
    container_name: portal-web
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      SMB_CREDENTIALS_FILE: /run/secrets/smb_credentials
      SMB_MOUNTS: ${SMB_MOUNTS:-}
      SHARE_MOUNT_ROOT: ${SHARE_MOUNT_ROOT:-/app/shares}
    secrets:
      - smb_credentials
    cap_add:
      - SYS_ADMIN
    ports:
      - "8000:8000"
    depends_on:
      - portal-db
    volumes:
      - .:/app

  portal-db:
    image: postgres:16-alpine
    container_name: portal-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portal}
      POSTGRES_USER: ${POSTGRES_USER:-portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portal}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

secrets:
  smb_credentials:
    file: ${SMB_CREDENTIALS_SOURCE:-./secrets.example}
