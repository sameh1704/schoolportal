services:
  portal-web:
    build: .
    container_name: portal-web
    privileged: true
    command: ["gunicorn", "portal.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "2"]
    env_file:
      - .env
    environment:
      SMB_CREDENTIALS_FILE: /run/secrets/smb_credentials
      SMB_MOUNTS: ${SMB_MOUNTS:-}
      SHARE_MOUNT_ROOT: ${SHARE_MOUNT_ROOT:-/app/shares}
    secrets:
      - source: smb_credentials
        target: /run/secrets/smb_credentials
      - source: django_env
        target: /run/secrets/django_env
    cap_add:
      - CAP_DAC_OVERRIDE
      - SYS_ADMIN
    ports:
      - "8010:8000"
    depends_on:
      portal-db:
        condition: service_healthy
    volumes:
      - schoolportal_static_volume:/app/staticfiles
    networks:
      - schoolportal_network

  portal-db:
    image: postgres:16-alpine
    container_name: portal-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portal}
      POSTGRES_USER: ${POSTGRES_USER:-portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portal}
    volumes:
      - schoolportal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - schoolportal_network

volumes:
  schoolportal_postgres_data:
    name: schoolportal_postgres_data
  schoolportal_static_volume:
    name: schoolportal_static_volume

networks:
  schoolportal_network:
    name: schoolportal_network

secrets:
  smb_credentials:
    file: ${SMB_CREDENTIALS_SOURCE:-./secrets.example}
  django_env:
    file: .env
